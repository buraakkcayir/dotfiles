name: Validate configuration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install desktop entry validator
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y desktop-file-utils zsh

      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh
          zsh -n .zshrc

      - name: Check script permissions
        run: |
          test -x scripts/audit-system.sh
          test -x scripts/prime-java.sh

      - name: Validate desktop entries
        run: |
          for file in autostart/*.desktop; do
            desktop-file-validate "$file"
          done

      - name: Reject personal absolute paths
        run: |
          if grep -RInE '/home/[^[:space:]]+|/Users/[^[:space:]]+|[A-Za-z]:\\\\Users\\\\' \
            --exclude-dir=.git --exclude='*.png' --exclude='validate.yml' .; then
            echo "Personal absolute paths are not allowed." >&2
            exit 1
          fi
