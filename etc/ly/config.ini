# =======================================================
#             CACHYOS / KDE PLASMA CONFIG                
# =======================================================

# --- LANGUAGE AND CLOCK ---
lang = en
clock = %d.%m.%Y
show_tty = false

# --- COLORS (Nord / Matte Dark Tones) ---
full_color = true
border_fg = 0x0189B4FA       # TB_BOLD (0x01) + Soft Ice Blue (#89B4FA)
fg = 0x00CDD6F4              # Clear and light text color (#CDD6F4)
bg = 0x001A1B26              # Dark background with slight anthracite/purple tint (Tokyo Night: #1A1B26)
error_fg = 0x01BF616A
error_bg = 0x00000000

# --- BOX AND SCREEN LAYOUT ---
box_title = null
blank_box = true
hide_borders = true
input_len = 40
margin_box_h = 3
margin_box_v = 3
initial_info_text = null

# --- BIG ASCII CLOCK ---
bigclock = en
bigclock_12hr = false
bigclock_seconds = false

# --- ANIMATION ---
animation = none

# --- NUM LOCK ---
numlock = true

# --- SHORTCUTS (Sequential Order F1 to F7) ---
shutdown_key = F1
shutdown_cmd = /sbin/shutdown -a now

restart_key = F2
restart_cmd = /sbin/shutdown -r now

sleep_key = F3
sleep_cmd = /bin/systemctl suspend

hibernate_key = F4
hibernate_cmd = /bin/systemctl hibernate

# Password on F5, Brightness on F6/F7 (To keep sequential order)
show_password_key = F5

brightness_down_key = F6
brightness_down_cmd = /usr/bin/brightnessctl -q -n s 10%-

brightness_up_key = F7
brightness_up_cmd = /usr/bin/brightnessctl -q -n s +10%

# --- TOP RIGHT LOCKS AND HINTS ---
hide_keyboard_locks = true   # Hides the NUMLOCK text on the top right
hide_version_string = true
hide_key_hints = false

# --- LOGIN AND USER EXPERIENCE ---
save = true
load = true
default_input = password

asterisk = 0x2022
clear_password = true
allow_empty_password = false

# --- SESSION AND WAYLAND MANAGEMENT ---
waylandsessions = /usr/share/wayland-sessions
xsessions = /usr/share/xsessions
xinitrc = null
shell = false
session_log = .local/state/ly-session.log

# =======================================================
#             SYSTEM INFO PANEL                        
# =======================================================

[lbl:kernel]
cmd = echo "Kernel: 7.2.3-1-cachyos"
refresh = 0
	
[lbl:battery]
cmd = echo "Battery: 100%"
refresh = 30
